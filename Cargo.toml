[package]
name = "tabi-ui"
version = "0.9.0"
edition = "2024"
description = "Reusable Dioxus components"
repository = "https://github.com/falineth/tabi-ui"
license = "MIT"

[dependencies]
dioxus = { version = "=0.7.10", features = ["router"] }
dioxus-free-icons = { version = "=0.10.0", features = [
    "material-design-icons-action",
    "material-design-icons-alert",
    "material-design-icons-av",
    "material-design-icons-communication",
    "material-design-icons-content",
    "material-design-icons-device",
    "material-design-icons-editor",
    "material-design-icons-file",
    "material-design-icons-hardware",
    "material-design-icons-home",
    "material-design-icons-image",
    "material-design-icons-maps",
    "material-design-icons-navigation",
    "material-design-icons-notification",
    "material-design-icons-places",
    "material-design-icons-social",
    "material-design-icons-toggle",
] }
nanoid = { version = "=0.5.0", optional = true }
nanoid-wasm = { version = "=0.1.3", features = ["wasm"], optional = true }
web-sys = { version = "=0.3.99", features = [
    "MediaQueryList",
    "Storage",
    "Window",
], optional = true }
js-sys = { version = "=0.3.99", optional = true }
dirs = { version = "=6.0.0", optional = true }
tokio = { version = "=1.53.1", features = ["time"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-tokio = { version = "=0.7.6", optional = true }
dbus = { version = "=0.9.12", optional = true }

[features]
desktop = [
    "dioxus/desktop",
    "dep:nanoid",
    "dep:dbus",
    "dep:dirs",
    "dep:dbus-tokio",
    "dep:tokio",
]
web = ["dioxus/web", "dep:nanoid-wasm", "dep:web-sys"]
